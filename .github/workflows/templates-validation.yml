name: "Templates Validation"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  helm-validate:
    name: "Validate Helm chart templates"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Install Helm"
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: "Helm lint"
        run: |
          helm lint helm/app-chart

      - name: "Helm template (render)"
        run: |
          helm template test-release helm/app-chart > /dev/null
