name: "L2 - Push Validate & Build"

on:
  workflow_call:
    inputs:
      image_name:
        description: "Image name (defaults to repo name)"
        required: false
        type: string
        default: ""
      dockerfile_path:
        description: "Path to Dockerfile"
        required: false
        type: string
        default: "./Dockerfile"

jobs:
  validate-and-build:
    name: "Validate & Build"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      REPO_OWNER: ${{ github.repository_owner }}
      IMAGE_NAME: ${{ inputs.image_name != '' && inputs.image_name || github.event.repository.name }}
      DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}

    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v4

      - name: "Application validations (placeholder)"
        run: |
          echo "No validation command is configured yet."
          echo "Update this step to run your application tests and linters."
          echo "Examples:"
          echo "  - pytest"
          echo "  - npm test"
          echo "  - golangci-lint run"

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Login to GHCR"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: "Build and Push Docker image"
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/${{ env.IMAGE_NAME }}:branch-${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Summary"
        run: |
          echo "Registry: ${{ env.REGISTRY }}"
          echo "Image: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/${{ env.IMAGE_NAME }}"

