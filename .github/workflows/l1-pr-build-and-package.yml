name: "L1 - PR Build & Helm Package"

on:
  workflow_call:
    inputs:
      image_name:
        description: 'Image name (defaults to repo name)'
        required: false
        type: string
        default: ''
      dockerfile_path:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: './Dockerfile'
      helm_chart_dir:
        description: 'Path to Helm chart directory'
        required: false
        type: string
        default: './helm/app-chart'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-package:
    name: "Build & Package"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      REPO_OWNER: ${{ github.repository_owner }}
      IMAGE_NAME: ${{ inputs.image_name != '' && inputs.image_name || github.event.repository.name }}
      DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
      HELM_CHART_DIR: ${{ inputs.helm_chart_dir }}

    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Login to GHCR (for caching)"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Build Docker image (Validation)"
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          push: false 
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Install Helm CLI"
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: "Lint Helm chart"
        run: |
          echo "Linting Helm chart in directory: ${HELM_CHART_DIR}"
          helm lint "${HELM_CHART_DIR}"

      - name: "Package Helm chart"
        run: |
          mkdir -p packaged-chart
          echo "Packaging Helm chart from: ${HELM_CHART_DIR}"
          helm package "${HELM_CHART_DIR}" --destination packaged-chart

      - name: "Upload packaged chart as workflow artifact"
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart-pr-${{ github.event.pull_request.number }}
          path: packaged-chart/*.tgz

